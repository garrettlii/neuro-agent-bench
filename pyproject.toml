[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nabench"
version = "0.0.1"
description = "Can general LLM agents analyse neuroscience data as well as task-specific trained models?"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6",
  "jsonschema>=4.18",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
