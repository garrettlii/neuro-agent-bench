# Pilot task, chosen before the selection rule (docs/TASK_SELECTION.md); reported separately.
# Draft fill. Remaining <<FILL values are owner decisions or facts still to look up.
# Scoring route A (owner decision 2026-10-27): the competition's private split through Kaggle late submissions, once a
# browser check confirms they still score; otherwise route B, a local re-split of labelled partitions. Route A has no
# local truth CSV, and the harness has no external-scorer path yet.
id: t15_speech
selection: pilot_pre_rule
modality: bci
source:
  name: >-
    Brain-to-Text '25 dataset, participant T15 (Card et al. 2024, NEJM, "An Accurate and Rapidly Calibrating Speech
    Neuroprosthesis"), hdf5_data_final, Dryad doi:10.5061/dryad.dncjsxm85 <<FILL: version; v5 of 2025-07-03 is current>>
  url: https://www.kaggle.com/competitions/brain-to-text-25 (code https://github.com/Neuroprosthetics-Lab/nejm-brain-to-text)
  licence: >-
    CC0 1.0 (data; Dryad record metadata). Redistribution of a derived split is allowed. The organizers' code repository
    has no top-level licence (only language_model/ carries one, Apache-2.0).
  released:
    data: "2024-10-09"
    test_labels: never
question: |
  A research participant with ALS and severe dysarthria attempted to speak sentences while neural activity was recorded
  from 256 microelectrodes in speech motor cortex. Each case is one attempted sentence: a time series of binned neural
  features. Development cases include the sentence the participant was attempting to say. Decode the attempted sentence
  for every test case. The decoder must not be told which text corpus a sentence came from.
prediction_format: >-
  `prediction` is the decoded sentence as English words separated by single spaces. Before scoring, both sentences are
  lower-cased and every character other than letters, apostrophes and hyphens is removed, so "don't" and "dont" are
  different words.
data:
  dev_inputs: ["{data_root}/tasks/t15_speech/dev/neural.h5"]
  dev_labels: ["{data_root}/tasks/t15_speech/dev/transcripts.csv"]
  test_inputs: ["{data_root}/tasks/t15_speech/test/neural.h5", "{data_root}/tasks/t15_speech/test/case_ids.csv"]
  truth: "{truth_root}/tasks/t15_speech/test_labels.csv"
metric:
  function: "nabench.tasks.t15_speech:wer_share"
  higher_is_better: false
  description: >-
    Aggregate word error rate (word edit distance summed over test sentences / reference words summed over test sentences),
    after the competition's text normalization. Per-case score = edits_i x N / W_total, so the mean over cases equals
    aggregate WER exactly.
baselines:
  simple: {function: "nabench.tasks.t15_speech:simple_baseline", description: "Organizers' pipeline (RNN, n-gram LM, LLM rescoring) in the largest configuration that fits this machine, retrained on dev only; record the configuration."}
  sota:
    name: "<<FILL: top private-leaderboard entry with released code>>"
    code: "<<FILL: repository URL and commit>>"
    function: "nabench.tasks.t15_speech:sota_baseline"
    published: {value: "<<FILL: private-leaderboard WER as a fraction, or null on a re-split>>", source: "<<FILL: Kaggle Brain-to-Text '25 private leaderboard, retrieval date>>"}
  automl:
    function: "nabench.tasks.t15_speech:automl_baseline"
    budget: {wall_time_s: 14400, gpu_hours: 4}
noise_ceiling:
  method: none
  function: null
budgets:
  tokens: 3000000
  wall_time_s: 14400
  gpu_hours: 4
  submission_limit: 3
tools:
  generic: [python, numpy, scipy, pandas, scikit-learn, torch, h5py]
  trained_models: "<<FILL: written with the task code. Owner decision 2026-10-27: rnn_baseline retrained on dev only; ngram_lm (the largest that fits RAM). No LLM rescorer as a tool, and no external LLM calls in any condition.>>"
scramble:
  method: label_permutation
  function: "nabench.tasks.t15_speech:scramble"
  description: >-
    Dev transcripts permuted across dev sentences within each session; test neural inputs permuted across test cases.
    What remains above the simple baseline is the language-model prior or leakage.
contamination:
  model_cutoffs_vs_release: >-
    Opus 5.5 cutoff 2026-07-01 and Sol 6.1 2026-05-01 (config/default.yaml). Data on Dryad since 2024-10-09 (v5 2025-07-03) and the
    competition closed 2025-12-31, before both cutoffs; competition test transcripts were not released with the data.
  test_labels_public: false
  split_provenance: "Competition train/val/test as released by the organizers; scored externally on the private two-thirds of the 1,450 test sentences."
