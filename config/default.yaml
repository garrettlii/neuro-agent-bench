# All three directories must be outside this repository and outside each other (enforced at load time).
paths:
  data_root: ~/benchmarks/nab/nab-data     # raw downloads, derived task data, trained-model tool weights
  runs_root: ~/benchmarks/nab/nab-runs     # per-run workspaces, logs and run records, per batch
  truth_root: ~/benchmarks/nab/nab-truth   # test labels, submissions, per-case scores and the ledger; scorer only

sandbox:
  # The agent can never read these either (related projects with design docs or answer keys).
  deny_extra: [~/benchmarks/dgb, ~/benchmarks/pf, ~/benchmarks/brb]
  # CLI state directories the agent CLI itself must write to.
  extra_write: [~/.claude-bench, ~/.codex-bench]
  # Models with `isolation: agent_user` run as this macOS user instead of under sandbox-exec, because their CLIs'
  # own sandboxes cannot start inside it (src/nabench/agentuser.py). One-time setup: scripts/setup_agent_user.sh.
  agent_user: nabagent
  agent_root: /Users/Shared/nab-agent/workspaces   # workspaces during a run; moved to runs_root afterwards
  agent_home: /Users/Shared/nab-agent/run/home     # HOME and TMPDIR of every run; emptied before and after each run
  agent_keep: /Users/Shared/nab-agent/keep         # models[].keep sign-in files between runs; unreadable to the agent user
  agent_path: /Users/Shared/nab-agent/bin:/Users/Shared/nab-agent/venv/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin

run:
  max_attempts: 3   # attempts per run that ended in an error; then an empty submission scores every case as missing
  retry_interval_s: 600   # run_batch.py --until-done waits this long between passes

# Identical for every model and condition; the task itself is in the workspace's TASK.md.
prompt: "Read TASK.md in the current directory and complete the task it describes. Work only inside the current directory."

conditions:
  C1: {mode: program, tools: all, scrambled: false}       # core
  C2: {mode: program, tools: generic, scrambled: false}   # C1 - C2: dependence on trained-model tools
  C3: {mode: program, tools: all, scrambled: true}        # scrambled signal; above baseline means leakage
  C4: {mode: investigate, tools: all, scrambled: false}   # subset of tasks
  C5: {mode: native, tools: generic, scrambled: false}    # subset of tasks; no code execution

modes:
  program: >
    Write and run code to analyse the development data and produce the test predictions.
  investigate: >
    Before producing predictions, explore the development data and write `submission/notes.md` describing
    what you examined, what you found and how it informed your approach. Then write and run code to produce
    the test predictions.
  native: >
    Do not write or run code. Read the files directly and write the predictions file yourself.

models:
  - name: fake-scripted       # deterministic stand-in for harness tests; never a reported model
    enabled: true
    backend: scripted
    module: nabench.fake_agent
    sandbox_network: false
  # Agent CLIs use workspace sign-ins. Confirm every flag with `claude --help` and `codex exec --help`
  # before the first run, and smoke-test on the dummy task only.
  - name: opus-5.5-cli
    enabled: true
    backend: cli
    cutoff_date: "2026-07-01"
    version_command: ["claude", "--version"]
    command: ["claude", "-p", "{prompt}", "--model", "claude-opus-5-5", "--output-format", "json",
              "--permission-mode", "bypassPermissions", "--allowedTools", "Bash,Read,Write,Edit,Glob,Grep",
              "--disallowedTools", "WebFetch,WebSearch,Task", "--strict-mcp-config", "--no-session-persistence",
              "--settings", '{"sandbox": {"enabled": true, "failIfUnavailable": true, "allowUnsandboxedCommands": false, "network": {"allowedDomains": [], "strictAllowlist": true}}}']
    command_native: ["claude", "-p", "{prompt}", "--model", "claude-opus-5-5", "--output-format", "json",
                     "--permission-mode", "bypassPermissions", "--allowedTools", "Read,Write,Glob,Grep",
                     "--disallowedTools", "Bash,Edit,WebFetch,WebSearch,Task", "--strict-mcp-config", "--no-session-persistence"]
    usage: last                # one JSON result object with a `usage` field
    isolation: agent_user      # the CLI reaches its API; its own sandbox (--settings) keeps agent commands offline
    env:
      CLAUDE_CONFIG_DIR: ~/.claude-bench   # ~ is sandbox.agent_home
    keep: [.claude-bench/.credentials.json, .claude-bench/.claude.json]   # the only files carried between runs
    login_command: [claude, auth, login]   # scripts/agent_login.py
  - name: sol-6.1-cli
    enabled: true
    backend: cli
    cutoff_date: "2026-05-01"
    version_command: ["codex", "--version"]
    command: ["codex", "exec", "--skip-git-repo-check", "--ephemeral", "--sandbox", "workspace-write",
              "-m", "gpt-6.1-sol", "-c", "model_reasoning_effort=\"xhigh\"", "--disable", "apps", "--disable", "plugins",
              "--disable", "browser_use", "--disable", "browser_use_external", "--disable", "multi_agent",
              "-c", "sandbox_workspace_write.network_access=false", "-c", "web_search=\"disabled\"",
              "--json", "--color", "never", "{prompt}"]
    usage: sum                 # JSONL events; per-turn `usage` objects are summed
    isolation: agent_user      # the CLI reaches its API; workspace-write with network_access=false keeps agent commands offline
    env:
      CODEX_HOME: ~/.codex-bench           # ~ is sandbox.agent_home
    keep: [.codex-bench/auth.json]
    login_command: [codex, login]
  - name: open-weights-cli
    enabled: false
    backend: cli
    cutoff_date: "<<FILL: model knowledge cutoff>>"
    version_command: ["<<FILL: version command>>"]
    command: ["<<FILL: agent CLI serving an open-weights model>>", "{prompt}"]
    usage: "<<FILL: last or sum>>"
    sandbox_network: true
